projects:
  - title: ReTeX
    status: In progress
    img: /assets/img/projects/retex.jpg
    url: /projects/retex/
    text: A vision-language model that reads the image of a page and writes LaTeX that compiles back into the same page. 0.74 mean fidelity on 400 unseen arXiv pages.
    tags: [VLM, Image-to-code, LaTeX]
  - title: DocAI
    status: Under review · ICLR 2027
    img: /assets/img/projects/docai.jpg
    url: /assets/pdf/DocAI_ICLR2027.pdf
    text: Detecting and localizing AI-edited content in whole documents, with a 35K-page benchmark and a 256M-parameter VLM detector. Built at IBM Research.
    tags: [Document forensics, VLM]
  - title: AI-MINTest
    status: Live
    img: /assets/img/ai-mintest.png
    url: https://ai-mintest.org
    text: A public web tool that checks whether given images or texts were used to train an AI model, based on the Membership Inference Test from my PhD.
    tags: [Auditing, Privacy, Demo]

